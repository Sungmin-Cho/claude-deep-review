name: Windows test diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/windows-test-diagnostic.yml'

permissions:
  contents: read

jobs:
  group-22:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-name-pattern '^\[group 22\]' tests/mutation-protocol.test.js
