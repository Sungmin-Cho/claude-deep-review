name: Windows test diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/windows-test-diagnostic.yml'

permissions:
  contents: read

jobs:
  test-file:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file:
          - tests/agy-fingerprint.test.js
          - tests/change-files.test.js
          - tests/config-contract.test.js
          - tests/detect-environment.test.js
          - tests/envelope-chain.test.js
          - tests/envelope-emit.test.js
          - tests/mutation-protocol.test.js
          - tests/native-release-smoke.test.js
          - tests/phase6-protocol.test.js
          - tests/plugin-contract.test.js
          - tests/respond-runtime.test.js
          - tests/reviewer-bridges.test.js
          - tests/reviewer-payload.test.js
          - tests/runtime-context.test.js
          - tests/skill-runtime-contract.test.js
          - tests/stage55-export.test.js
    runs-on: windows-latest
    timeout-minutes: 15
    name: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test "${{ matrix.file }}"
