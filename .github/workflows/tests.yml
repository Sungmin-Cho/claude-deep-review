name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ko.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'hooks/**'
      - 'hooks/scripts/test/**'
      - 'scripts/**'
      - 'commands/**'
      - 'skills/**'
      - 'agents/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: native tests (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run native tests
        run: npm test

  legacy-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: legacy Unix oracle (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check recursive legacy enrollment
        run: bash scripts/check-test-ci-enrollment.sh

      - name: Run recursive legacy oracle
        run: npm run test:legacy
