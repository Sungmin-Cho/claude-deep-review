name: Phase 6 Protocol Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ko.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'hooks/**'
      - 'hooks/scripts/test/**'
      - 'scripts/**'
      - 'commands/**'
      - 'skills/**'
      - 'agents/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Phase 6 native (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Phase 6 native contracts
        run: node --test tests/phase6-protocol.test.js tests/respond-runtime.test.js tests/skill-runtime-contract.test.js
